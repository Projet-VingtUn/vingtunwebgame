<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity Web Player | Vingt1</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">

  <style>
  #unity-progress-text {
    margin-top: 8px;
    color: white;
    font-size: 14px;
    font-family: Arial, sans-serif;
    text-align: center;
  }
</style>
</head>

<body>

  <!-- 🔍 LOG DE VÉRIFICATION DU BON FICHIER -->
  <script>
    console.log("### INDEX UNITY POSTMESSAGE DEBUG LOADED ###");
    console.log("[JS] location.href =", location.href);
    console.log("[JS] location.origin =", location.origin);
  </script>

  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
      <div id="unity-progress-text">0%</div>
    </div>
    <div id="unity-warning"></div>
    <div id="unity-footer">
      <div id="unity-logo-title-footer"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title">Vingt1</div>
    </div>
  </div>

  <!-- 🔐 Référence Unity -->
  <script>
    var unityInstanceRef = null;
    var pendingAuthToken = null;

    console.log("[JS] Bridge postMessage initialisé");

    // Réception du token depuis le site parent (React)
    window.addEventListener("message", function (event) {
      console.log("[JS] message event reçu :", event.origin, event.data);

      if (event.origin !== "https://vingt1.com") {
        console.warn("[JS] origin refusée :", event.origin);
        return;
      }

      if (event.data && event.data.type === "AUTH_TOKEN") {
        console.log("[JS] AUTH_TOKEN reçu");

        pendingAuthToken = event.data.token;
        console.log("[JS] pendingAuthToken set =", !!pendingAuthToken);

        // Si Unity est déjà prête → on envoie immédiatement
        if (unityInstanceRef) {
          console.log("[JS] Unity déjà prête → envoi immédiat");
          sendTokenToUnity();
        } else {
          console.log("[JS] Unity pas encore prête → token en attente");
        }
      }
    });

    function sendTokenToUnity() {
      console.log("[JS] sendTokenToUnity() appelé");

      if (!unityInstanceRef) {
        console.warn("[JS] unityInstanceRef NULL");
        return;
      }

      if (!pendingAuthToken) {
        console.warn("[JS] pendingAuthToken NULL");
        return;
      }

      console.log("[JS] Envoi du token à Unity");
      unityInstanceRef.SendMessage(
        "WebAutoLogin",
        "OnReceiveToken",
        pendingAuthToken
      );

      pendingAuthToken = null;
      console.log("[JS] pendingAuthToken reset");
    }
  </script>

  <!-- 🔧 Unity loader -->
  <script>
    var canvas = document.querySelector("#unity-canvas");

    function unityShowBanner(msg, type) {
      var warningBanner = document.querySelector("#unity-warning");
      function updateBannerVisibility() {
        warningBanner.style.display = warningBanner.children.length ? "block" : "none";
      }
      var div = document.createElement("div");
      div.innerHTML = msg;
      warningBanner.appendChild(div);
      if (type === "error") div.style = "background:red;padding:10px;";
      else {
        if (type === "warning") div.style = "background:yellow;padding:10px;";
        setTimeout(function () {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }, 5000);
      }
      updateBannerVisibility();
    }

   var buildUrl = "Build"; 
var loaderUrl = buildUrl + "/build.loader.js"; 
var config = {
  dataUrl: buildUrl + "/build.data.gz",
  frameworkUrl: buildUrl + "/build.framework.js.gz",
  codeUrl: buildUrl + "/build.wasm.gz",
  streamingAssetsUrl: "StreamingAssets",
  companyName: "eeruscap",
  productName: "Vingt1",
  productVersion: "1.0.0",
  showBanner: unityShowBanner,
};

    // var buildUrl = "Build";
    // var loaderUrl = buildUrl + "/Build Web with MULTI.loader.js";
    // var config = {
    //   dataUrl: buildUrl + "/Build Web with MULTI.data",
    //   frameworkUrl: buildUrl + "/Build Web with MULTI.framework.js",
    //   codeUrl: buildUrl + "/Build Web with MULTI.wasm",
    //   streamingAssetsUrl: "StreamingAssets",
    //   companyName: "eeruscap",
    //   productName: "Vingt1",
    //   productVersion: "1.0.0",
    //   showBanner: unityShowBanner,
    // };

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      var meta = document.createElement("meta");
      meta.name = "viewport";
      meta.content = "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
      document.getElementsByTagName("head")[0].appendChild(meta);
      document.querySelector("#unity-container").className = "unity-mobile";
      canvas.className = "unity-mobile";
    } else {
      canvas.style.width = "960px";
      canvas.style.height = "600px";
    }

        // 🖼 Image de fond (mets Mini Coupe.jpg dans le même dossier que index.html)
        canvas.style.background = "url('bg.png') center / cover";

    document.querySelector("#unity-loading-bar").style.display = "block";

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      console.log("[JS] Loader Unity chargé");

   createUnityInstance(canvas, config, (progress) => {
  const percent = Math.round(progress * 100);

  document.querySelector("#unity-progress-bar-full").style.width = percent + "%";
  document.querySelector("#unity-progress-text").innerText = percent + "%";
}).then((unityInstance) => {
        console.log("[JS] Unity instance prête");

        unityInstanceRef = unityInstance;

        // 🔑 SI le token est déjà arrivé → on l’envoie maintenant
        sendTokenToUnity();
document.querySelector("#unity-progress-text").innerText = "100%";
        document.querySelector("#unity-loading-bar").style.display = "none";
        document.querySelector("#unity-fullscreen-button").onclick = () => {
          unityInstance.SetFullscreen(1);
        };
      }).catch((message) => {
        console.error("[JS] Erreur Unity", message);
        alert(message);
      });
    };

    document.body.appendChild(script);
  </script>
</body>
</html>
